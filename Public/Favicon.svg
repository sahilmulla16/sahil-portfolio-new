<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradient matching Sahil's portfolio accent colors -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89AACC" />
      <stop offset="100%" stop-color="#4E85BF" />
    </linearGradient>
  </defs>
  
  <!-- Rounded background container -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#bg-gradient)" />
  
  <!-- Elegant 'SM' text -->
  <text 
    x="50%" 
    y="55%" 
    font-family="'Instrument Serif', 'Inter', sans-serif" 
    font-size="240" 
    font-weight="bold" 
    font-style="italic"
    fill="#0a0a0a" 
    dominant-baseline="middle" 
    text-anchor="middle"
  >
    SM
  </text>
</svg>